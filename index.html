<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qQuiz Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Edu+AU+VIC+WA+NT+Arrows:wght@400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- <link rel="stylesheet" href="/html/my-new-github/quizGame.css" /> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #171717, #252525);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
      }

      #container {
        width: 100%;
        max-width: 600px;
        min-height: 500px;
        background: #212121;
        border: 1px solid #383838;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .level {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .level::before {
        content: "QUIZ GAME";
        color: #3b82f6;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .counter {
        background: #2b2b2b;
        color: #60a5fa;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 15px;
      }

      .quition {
        margin-bottom: 25px;
      }

      .qui {
        background: #181818;
        color: white;
        min-height: 130px;
        height: auto;
        padding: 30px 20px;
        border-radius: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: clamp(22px, 4vw, 32px);
        line-height: 1.4;
        border: 1px solid #333;
      }

      .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn {
        margin: 0;
        min-height: 70px;
        background: #2b2b2b;
        color: #e5e7eb;
        border: 1px solid #3a3a3a;
        border-radius: 14px;
        padding: 15px;
        font-size: 17px;
        font-weight: 500;
        font-family: Arial, sans-serif;
        letter-spacing: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.25s ease;
      }

      .btn:hover {
        background: #2563eb;
        border-color: #3b82f6;
        color: white;
        transform: translateY(-2px);
      }

      .correctClick {
        background-color: green;
        color: white;
      }

      .btnNone {
        display: none;
      }

      .displayAnswers {
        list-style: none;
        font-size: 17px;
        text-align: center;
        background: #181818;
        color: white;
        border-radius: 15px;
        line-height: 35px;
        padding: 20px;
        box-shadow: none;
        height: auto;
      }

      .displayAnswers {
        display: none;
      }

      .visble {
        display: block;
      }

      .result {
        display: block;
        background-color: #2b2b2b;
        color: white;
        text-align: center;
        width: 100%;
        border-radius: 8px;
        padding: 8px;
        letter-spacing: 1px;
        margin-top: 5px;
      }

      .result:hover {
        background-color: #2563eb;
        color: white;
      }

      .chak {
        display: none;
      }

      .blink-text {
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.4;
        }
      }

      @media (max-width: 500px) {
        body {
          padding: 12px;
        }

        #container {
          padding: 16px;
          border-radius: 18px;
        }

        .answers {
          grid-template-columns: 1fr;
        }

        .btn {
          min-height: 58px;
          font-size: 16px;
        }

        .qui {
          min-height: 110px;
          padding: 20px 15px;
        }
      }
      .timer {
        background: #2b2b2b;
        color: #60a5fa;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 15px;
      }

      .game-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .game-actions button {
        flex: 1;
        padding: 13px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: 600;
      }

      .game-actions button:hover {
        background: #1d4ed8;
      }

      #resetGame {
        background: #374151;
      }

      #resetGame:hover {
        background: #4b5563;
      }

      .correct {
        background-color: #16a34a !important;
        color: white !important;
      }

      .wrong {
        background-color: #dc2626 !important;
        color: white !important;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="level">
        <h2 class="counter">1/4</h2>
      </div>
      <div class="quition">
        <h1 class="qui">q</h1>
      </div>
      <div class="answers">
        <h1 class="btn" id="btn1">1</h1>
        <h1 class="btn" id="btn2">2</h1>
        <h1 class="btn" id="btn3">3</h1>
        <h1 class="btn" id="btn4">4</h1>
        <audio src="/projects_sounds/correct-156911.mp3" id="correct"></audio>
        <audio
          src="/projects_sounds/wrong-answer-129254.mp3"
          id="wrong"
        ></audio>
      </div>
      <div id="displayAnswers" class="answerslist"></div>
    </div>

    <!-- <script src="/html/my-new-github/quizGame.js"></script> -->
    <script>
      let currentQuestion = 0;
      let score = 0;
      let selected = false;

      let seconds = 0;
      let timer;
      let gameStarted = false;

      const counterNumber = document.querySelector(".counter");
      const qui = document.querySelector(".qui");
      const btn = document.querySelectorAll(".btn");
      const answersContainer = document.querySelector(".answers");

      const soundCorrect = document.getElementById("correct");
      const soundWrong = document.getElementById("wrong");

      // TIMER UI
      const timerElement = document.createElement("div");
      timerElement.className = "timer";
      timerElement.innerText = "Time: 00:00";

      document.querySelector(".level").appendChild(timerElement);

      const questions = [
        {
          question: "What is the capital of India?",
          answers: ["Mumbai", "Delhi", "Kolkata", "Chennai"],
          correct: 1,
        },
        {
          question: "Which is the largest planet in our solar system?",
          answers: ["Earth", "Mars", "Jupiter", "Venus"],
          correct: 2,
        },
        {
          question: "Who was the first President of India?",
          answers: [
            "Dr. B. R. Ambedkar",
            "Dr. Rajendra Prasad",
            "Sardar Vallabhbhai Patel",
            "Jawaharlal Nehru",
          ],
          correct: 1,
        },
        {
          question: "What is the capital of Japan?",
          answers: ["Beijing", "Seoul", "Tokyo", "Bangkok"],
          correct: 2,
        },
      ];

      // TIMER START
      function startTimer() {
        clearInterval(timer);

        timer = setInterval(() => {
          seconds++;

          const minutes = Math.floor(seconds / 60);
          const remainingSeconds = seconds % 60;

          timerElement.innerText = `Time: ${String(minutes).padStart(2, "0")}:${String(
            remainingSeconds,
          ).padStart(2, "0")}`;
        }, 1000);
      }

      // QUESTION SHOW
      function showQuestion() {
        selected = false;

        const current = questions[currentQuestion];

        counterNumber.innerText = `${currentQuestion + 1}/${questions.length}`;

        qui.innerText = current.question;

        btn.forEach((button, index) => {
          button.classList.remove("correct", "wrong");

          button.innerText = current.answers[index];

          button.style.pointerEvents = "auto";
        });
      }

      // ANSWER CLICK
      function selectAnswer() {
        if (selected) return;

        // Timer first click par start hoga
        if (!gameStarted) {
          gameStarted = true;
          startTimer();
        }

        selected = true;

        const selectedIndex = [...btn].indexOf(this);
        const correctIndex = questions[currentQuestion].correct;

        btn.forEach((button) => {
          button.style.pointerEvents = "none";
        });

        if (selectedIndex === correctIndex) {
          this.classList.add("correct");

          score++;

          soundCorrect.currentTime = 0;
          soundCorrect.play();
        } else {
          this.classList.add("wrong");

          btn[correctIndex].classList.add("correct");

          soundWrong.currentTime = 0;
          soundWrong.play();
        }

        setTimeout(() => {
          currentQuestion++;

          if (currentQuestion >= questions.length) {
            showResult();
          } else {
            showQuestion();
          }
        }, 1000);
      }

      // GAME OVER
      function showResult() {
        clearInterval(timer);

        answersContainer.style.display = "none";

        // Time store
        localStorage.setItem("quizTime", seconds);
        localStorage.setItem("quizScore", score);

        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;

        const finalTime = `${String(minutes).padStart(2, "0")}:${String(
          remainingSeconds,
        ).padStart(2, "0")}`;

        counterNumber.innerText = "Game Over";

        qui.innerHTML = `
      🎉 Game Over!

      <br><br>

      Score: ${score}/${questions.length}

      <br>

      Time: ${finalTime}
    `;

        const actions = document.createElement("div");

        actions.className = "game-actions";

        actions.innerHTML = `
      <button id="playAgain">Play Again</button>
      <button id="resetGame">Reset</button>
    `;

        document.querySelector("#container").appendChild(actions);

        document
          .getElementById("playAgain")
          .addEventListener("click", playAgain);

        document
          .getElementById("resetGame")
          .addEventListener("click", resetGame);
      }

      // PLAY AGAIN
      function playAgain() {
        currentQuestion = 0;
        score = 0;
        seconds = 0;
        selected = false;
        gameStarted = false;

        clearInterval(timer);

        timerElement.innerText = "Time: 00:00";

        answersContainer.style.display = "grid";

        document.querySelector(".game-actions")?.remove();

        showQuestion();
      }

      // RESET
      function resetGame() {
        clearInterval(timer);

        currentQuestion = 0;
        score = 0;
        seconds = 0;
        selected = false;
        gameStarted = false;

        localStorage.removeItem("quizTime");
        localStorage.removeItem("quizScore");

        timerElement.innerText = "Time: 00:00";

        answersContainer.style.display = "grid";

        document.querySelector(".game-actions")?.remove();

        showQuestion();
      }

      // BUTTON EVENTS
      btn.forEach((button) => {
        button.addEventListener("click", selectAnswer);
      });

      // START GAME
      showQuestion();
    </script>
  </body>
</html>
